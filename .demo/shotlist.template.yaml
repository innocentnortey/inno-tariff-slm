project: "Tariff Specialist SLM"
tagline: "A small model that decides only when the description supports it, and otherwise asks"
url: http://127.0.0.1:8812/index.html
dev:
  command: "python3 -m http.server 8812 --bind 127.0.0.1 --directory .demo/replay"
  url: http://127.0.0.1:8812/index.html
  ready_timeout: 30
viewport: {width: 1600, height: 820}
show_requirement: false
caption_band:
  height: 80
  background: "#0f1418"
  label: "Recorded runs · sealed test from 2024–2025 rulings"
voice:
  model: eleven_multilingual_v2
  speed: 0.9
  stability: 0.45
  similarity_boost: 0.8
  style: 0.2
card_theme: {background: "#0f1418", accent: "#5fc2b6"}

scenes:
  - id: intro
    type: card
    title: "A tariff specialist that knows when to ask"
    subtitle: "Gauntlet AI · Week 7 · Train Your Own Small Language Model"
    lines: ["Qwen3-1.7B fine-tuned on CBP-labelled rulings", "Decides only when the description supports it — otherwise asks"]
    narration: "@@intro"

  - id: overview
    type: card
    html_file: .demo/cards/overview.html
    narration: "@@overview"

  - id: architecture
    type: card
    html_file: .demo/cards/architecture.html
    narration: "@@architecture"

  - id: live1
    evidence: ['train/modal_app.py']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#live1').scrollIntoView({block: 'start'})"
    narration: "@@live1"
    actions:
      - wait: 2
      - highlight: {selector: '#live1 .ans.t', seconds: 3}

  - id: live2
    evidence: ['train/modal_app.py']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#live2').scrollIntoView({block: 'start'})"
    narration: "@@live2"
    actions:
      - wait: 2
      - highlight: {selector: '#live2 .ans.b', seconds: 3}
      - at: 0.55F
      - highlight: {selector: '#live2 .ans.t', seconds: 4}

  - id: case1
    evidence: ['docs/evals/step10-head-to-head-2026-11-01.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#case1').scrollIntoView({block: 'start'})"
    narration: "@@case1"
    actions:
      - wait: 2
      - highlight: {selector: '#case1 .ans.o', seconds: 3}
      - at: 0.6F
      - highlight: {selector: '#case1 .ans.t', seconds: 4}

  - id: case2
    evidence: ['docs/evals/step10-head-to-head-2026-11-01.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#case2').scrollIntoView({block: 'start'})"
    narration: "@@case2"
    actions:
      - wait: 1.5
      - highlight: {selector: '#case2 .ans.t', seconds: 3}

  - id: curve
    evidence: ['SUBMISSION.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#curve').scrollIntoView({block: 'start'})"
    narration: "@@curve"
    actions:
      - wait: 2
      - highlight: {selector: '#curve .bar.on', seconds: 3}

  - id: weak
    evidence: ['docs/evals/step10-head-to-head-2026-11-01.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#weak').scrollIntoView({block: 'start'})"
    narration: "@@weak"
    actions:
      - wait: 2
      - highlight: {selector: '#weak .ans.t', seconds: 3}
      - at: 0.6F
      - highlight: {selector: '#weak .note', seconds: 3}

  - id: results
    evidence: ['docs/evals/step10-head-to-head-2026-11-01.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#results').scrollIntoView({block: 'start'})"
    narration: "@@results"
    actions:
      - wait: 2
      - highlight: {selector: '#results tr.star >> nth=0', seconds: 3}
      - at: 0.55F
      - highlight: {selector: '#results tr.star >> nth=1', seconds: 3}

  - id: plan
    evidence: ['docs/delivery/brainlift.md']
    before:
      - goto: /index.html
      - eval: "document.documentElement.style.scrollBehavior = 'auto'; document.querySelector('#plan').scrollIntoView({block: 'start'})"
    narration: "@@plan"
    actions:
      - wait: 2
      - highlight: {selector: '#plan .card >> nth=1', seconds: 3}
      - at: 0.55F
      - highlight: {selector: '#plan .card.hi', seconds: 4}

  - id: outro
    type: card
    title: "Decide when the evidence is there. Ask when it isn't."
    subtitle: "Model and dataset on Hugging Face · youngjr1232"
    lines: ["Asks for missing facts more reliably than a frontier model", "Next: the full search, with better candidate retrieval"]
    narration: "@@outro"
