[project]
name = "tariff-slm"
version = "0.1.0"
description = "Tariff-classification specialist SLM (Gauntlet Week 7) — data, evals and training"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm>=0.20"]
api = ["anthropic>=0.40", "openai>=1.50"]
train = ["unsloth", "trl", "datasets", "transformers", "peft", "bitsandbytes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_slm"]
